name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate

      - name: Build frontend
        run: pnpm --filter web build-only

      - name: Build backend
        run: pnpm --filter server build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend
        run: rsync -avz --delete apps/web/dist/ root@${{ secrets.SERVER_HOST }}:/www/nva/web/

      - name: Deploy backend
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            apps/server/dist/ root@${{ secrets.SERVER_HOST }}:/www/nva/server/dist/

          rsync -avz apps/server/prisma/ root@${{ secrets.SERVER_HOST }}:/www/nva/server/prisma/
          rsync -avz apps/server/package.json root@${{ secrets.SERVER_HOST }}:/www/nva/server/
          rsync -avz pnpm-lock.yaml root@${{ secrets.SERVER_HOST }}:/www/nva/server/

      - name: Restart backend
        run: |
          ssh root@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /www/nva/server
            pnpm install --frozen-lockfile
            npx prisma migrate deploy
            pnpm seed
            pm2 restart nva
          EOF
